[Octo API settings]
# Fill these with values from your own current IDOLY PRIDE client when using
# --source api. They may change with a game update. Environment variables named
# IDOLY_OCTO_URL, IDOLY_OCTO_APP_ID, IDOLY_OCTO_VERSION,
# IDOLY_OCTO_CLIENT_SECRET_KEY, and IDOLY_OCTO_AES_PASSPHRASE override this file.
# IDOLY_OCTO_AES_KEY_HEX may be used instead of the passphrase.
URL =
APP_ID =
VERSION =
CLIENT_SECRET_KEY =
AES_PASSPHRASE =
AES_KEY_HEX =

[Firebase settings]
# Used only when --auth-xml needs to refresh an expired Firebase token.
# Prefer cache/firebase-settings.json or IDOLY_FIREBASE_API_KEY for local values.
API_KEY =

[Download settings]
# Raw resources already on disk are reused only after size and MD5 verification.
# Default store paths for assets and resources are in the section below.
# set `UPDATE` to `True` for copy the downloaded files from update path to default store
# path or `False` to move (The default value for first download is False).
UPDATE_FLAG = False
MAX_RETRIES = 5

[Path settings]
ASSET_PATH = cache/asset
RESOURCE_PATH = cache/resource
UPDATE_PATH = cache/update

[Unity settings]
UNITY_SIGNATURE = Unity
UNITY_VERSION = 2022.3.57f1

